services:
  # Frontend (React + Vite) via Nginx
  nexdojo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexdojo-qas
    restart: always
    ports:
      - "3003:80"
    networks:
      - nexdojo-net

  # API Backend (Node.js + Express + Prisma)
  nexdojo-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: nexdojo-api
    restart: always
    ports:
      - "3005:3005"
    env_file:
      - ./api/.env
    networks:
      - nexdojo-net

networks:
  nexdojo-net:
    driver: bridge
