services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./api/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Sem isso o json-file driver cresce sem limite até encher o disco do servidor
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    build: .
    restart: unless-stopped
    ports:
      - "3003:80"
    depends_on:
      - api
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
