server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api {
        proxy_pass http://api:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # O index.html aponta para assets com hash no nome, e cada build gera hashes novos. Sem
    # Cache-Control ele era guardado pelo cache heurístico do navegador: depois de um deploy a
    # aba antiga continuava pedindo chunks que já não existem no container, e a tela quebrava com
    # "Failed to fetch dynamically imported module". "no-cache" não desliga o cache, só obriga a
    # revalidar — se nada mudou a resposta continua sendo um 304 barato.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
